<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #3d77f3 0%, #6788ad 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #030303;
            margin-bottom: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .logo span {
            color: #2563eb;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-group input {
            padding: 12px 16px;
            border: 2px solid #000000;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #1d4ed8;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <a href="index.html" class="logo">Job<span>Hub</span></a>
        <h2>Create Candidate Account</h2>

        <form id="registrationForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create a strong password" required>
            </div>

            <button type="submit" class="btn-register">Sign Up As Candidate</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", (e) => {
            e.preventDefault();

            const nameValue = document.getElementById("regName").value.trim();
            const emailValue = document.getElementById("regEmail").value.toLowerCase().trim();
            const passwordValue = document.getElementById("regPassword").value;

            if (!nameValue || !emailValue || !passwordValue) {
                alert("🛑 Please fill in all the details correctly!");
                return;
            }

            // 1. LocalStorage se usersDatabase load karo, nahi toh empty array banao
            let usersDatabase = JSON.parse(localStorage.getItem('usersDatabase')) || [];

            // 2. Check karo ki email pehle se registered toh nahi hai
            const userExists = usersDatabase.some(u => u.email === emailValue);
            if (userExists) {
                alert("⚠️ This email is already registered! Please login or use another email.");
                window.location.href = "login.html";
                return;
            }

            // 3. Naya user structure set karo (Candidate is always seeker)
            const newUser = {
                name: nameValue,
                email: emailValue,
                password: passwordValue,
                role: 'seeker' 
            };

            // 4. Array me add karke store karo
            usersDatabase.push(newUser);
            localStorage.setItem('usersDatabase', JSON.stringify(usersDatabase));

            // Legacy system compatibility backup
            localStorage.setItem('registeredEmail', emailValue);
            localStorage.setItem('registeredPassword', passwordValue);
            localStorage.setItem('registeredName', nameValue);

            alert("🎉 Account Created Successfully as Job Seeker!");
            
            // Redirect to Login Page
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
